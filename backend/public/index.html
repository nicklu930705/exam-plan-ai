<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考試計畫 AI - 後端服務狀態</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #F7F6F1;
      color: #30332F;
    }
    .card {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      max-width: 440px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #E9EEE5;
      color: #788B73;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      color: #30332F;
    }
    p {
      font-size: 14px;
      color: #858780;
      line-height: 1.6;
      margin: 0 0 16px 0;
    }
    code {
      background: #EFEFEA;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 13px;
      color: #788B73;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● 服務正常運作中</div>
    <h1>考試計畫 AI - 後端服務</h1>
    <p>Google Gemini AI 安全代理與智慧讀書規劃服務已成功部署。</p>
    <p>API 端點：<code>POST /api/study-advice</code></p>
  </div>
</body>
</html>
